name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: make install
      - run: make ci
      - run: make browser-install ARGS=--with-deps
      - name: Start the local stack
        run: make up ENV_FILE=.env.example
        env:
          POSTGRES_PASSWORD: ci-only-ephemeral-password
      - run: make test-e2e
        env:
          E2E_DIRECTORY_DB_CONTAINER: glizzy-gauntlet-db-1
          E2E_TEST_DB_CONTAINER: glizzy-gauntlet-db-1
      - name: Rehearse a clean database and media restore
        run: make test-recovery
        env:
          RECOVERY_TEST_DISPOSABLE: '1'
          RECOVERY_SOURCE_PROJECT: glizzy-gauntlet
      - name: Stop the local stack
        if: always()
        run: docker compose --env-file .env.example -f infra/compose.yaml -f infra/compose.dev.yaml down --volumes
        env:
          POSTGRES_PASSWORD: ci-only-ephemeral-password
