openapi: 3.0.3
info:
  title: Glizzy Gauntlet API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /venues:
    get:
      operationId: listVenues
      parameters:
        - $ref: '#/components/parameters/Page'
        - {
            name: south,
            in: query,
            schema: { type: number, minimum: -90, maximum: 90 },
          }
        - {
            name: north,
            in: query,
            schema: { type: number, minimum: -90, maximum: 90 },
          }
        - {
            name: west,
            in: query,
            schema: { type: number, minimum: -180, maximum: 180 },
          }
        - {
            name: east,
            in: query,
            schema: { type: number, minimum: -180, maximum: 180 },
          }
      responses:
        '200':
          description: Approved visible venues, ordered by name; supply all four bounds together, west no greater than east
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenuePage'
        default:
          $ref: '#/components/responses/CompetitionError'
  /venues/{id}:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    get:
      operationId: getVenue
      responses:
        '200':
          description: Current approved public venue revision only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        default:
          $ref: '#/components/responses/CompetitionError'
  /venues/{id}/visibility:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    put:
      operationId: setVenueVisibility
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hidden, reason]
              properties:
                hidden: { type: boolean }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '204':
          description: Site-owner-only audited visibility change; hidden venues and their photos disappear from public views and featured lists
        default:
          $ref: '#/components/responses/CompetitionError'
  /directory/contributions:
    get:
      operationId: listDirectoryContributions
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: scope
          in: query
          schema: { type: string, enum: [mine, pending, all], default: mine }
      responses:
        '200':
          description: Own contribution history, or site-owner-only pending queue/all contribution history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionPage'
        default:
          $ref: '#/components/responses/CompetitionError'
    post:
      operationId: createDirectoryContribution
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryInput'
      responses:
        '201':
          description: Private draft; attach optional photos before explicitly submitting for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contribution'
        default:
          $ref: '#/components/responses/CompetitionError'
  /directory/contributions/{id}:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    get:
      operationId: getDirectoryContribution
      responses:
        '200':
          description: Contributor or site-owner view, never public
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contribution'
        default:
          $ref: '#/components/responses/CompetitionError'
    delete:
      operationId: discardDirectoryContribution
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Contributor discards a nonapproved contribution and removes its photos
        default:
          $ref: '#/components/responses/CompetitionError'
  /directory/contributions/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    post:
      operationId: submitDirectoryContribution
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Draft locked and placed in the moderation queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contribution'
        default:
          $ref: '#/components/responses/CompetitionError'
  /directory/contributions/{id}/photos:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    post:
      operationId: uploadDirectoryPhoto
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                menuItemId: { type: string, format: uuid }
      responses:
        '201':
          description: Sanitized JPEG and thumbnail; actual JPEG/PNG content only, at most 5 MiB, 6000 pixels per side and 12 megapixels; maximum 10 photos per draft and 200 per contributor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryPhoto'
        default:
          $ref: '#/components/responses/CompetitionError'
  /directory/contributions/{id}/review:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    post:
      operationId: reviewDirectoryContribution
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approve, reason]
              properties:
                approve: { type: boolean }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Site-owner-only audited decision; approval replaces the entire venue and photo revision, refusing stale updates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contribution'
        default:
          $ref: '#/components/responses/CompetitionError'
  /directory/photos/{id}:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    get:
      operationId: getDirectoryPhoto
      parameters:
        - name: thumbnail
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Reencoded image only; public only when associated with a currently visible approved venue revision; otherwise contributor/site owner only, always no-store
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        default:
          $ref: '#/components/responses/CompetitionError'
  /competitions/{id}/featured-venues:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    get:
      operationId: listFeaturedVenues
      responses:
        '200':
          description: Approved visible featured venues, with the competition's draft/private access rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Venue'
        default:
          $ref: '#/components/responses/CompetitionError'
  /competitions/{id}/featured-venues/{venue}:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
      - name: venue
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: featureVenue
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Organizer-only idempotent addition; maximum 20 featured venues
        default:
          $ref: '#/components/responses/CompetitionError'
    delete:
      operationId: unfeatureVenue
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Organizer-only idempotent removal
        default:
          $ref: '#/components/responses/CompetitionError'
  /competitions:
    get:
      operationId: listCompetitions
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: scope
          in: query
          schema:
            type: string
            enum: [public, mine]
            default: public
      responses:
        '200':
          description: Published public competitions, or the signed-in user's active memberships and drafts
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Competition'
                  hasMore:
                    type: boolean
        default:
          $ref: '#/components/responses/CompetitionError'
    post:
      operationId: createCompetition
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitionSettings'
      responses:
        '201':
          $ref: '#/components/responses/Competition'
        default:
          $ref: '#/components/responses/CompetitionError'
  /competitions/{id}:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    get:
      operationId: getCompetition
      responses:
        '200':
          $ref: '#/components/responses/Competition'
        default:
          $ref: '#/components/responses/CompetitionError'
    put:
      operationId: updateCompetition
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, settings]
              properties:
                version:
                  type: integer
                  format: int64
                  minimum: 0
                settings:
                  $ref: '#/components/schemas/CompetitionSettings'
      responses:
        '200':
          $ref: '#/components/responses/Competition'
        default:
          $ref: '#/components/responses/CompetitionError'
  /competitions/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    post:
      operationId: publishCompetition
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version:
                  type: integer
                  format: int64
                  minimum: 0
      responses:
        '200':
          $ref: '#/components/responses/Competition'
        default:
          $ref: '#/components/responses/CompetitionError'
  /competitions/{id}/join:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    post:
      operationId: joinCompetition
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/Competition'
        default:
          $ref: '#/components/responses/CompetitionError'
  /competitions/{id}/members:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    get:
      operationId: listCompetitionMembers
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Member-only directory; no emails, identities, or other competitions
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompetitionMember'
                  hasMore:
                    type: boolean
        default:
          $ref: '#/components/responses/CompetitionError'
  /competitions/{id}/members/{user}/exclude:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
      - name: user
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: excludeCompetitionMember
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '204':
          description: Excluded from joining and member access; action and reason audited
        default:
          $ref: '#/components/responses/CompetitionError'
  /competitions/{id}/invitations:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
    get:
      operationId: listCompetitionInvitations
      responses:
        '200':
          description: Organizer-only metadata, active invitations first, at most 50; no bearer tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetitionInvitation'
        default:
          $ref: '#/components/responses/CompetitionError'
    post:
      operationId: createCompetitionInvitation
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '201':
          description: Link shown once; reusable until revoked, seven days, or eating ends, whichever comes first
          content:
            application/json:
              schema:
                type: object
                required: [id, inviteUrl, expiresAt]
                properties:
                  id:
                    type: string
                    format: uuid
                  inviteUrl:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
        default:
          $ref: '#/components/responses/CompetitionError'
  /competitions/{id}/invitations/{invitation}:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
      - name: invitation
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeCompetitionInvitation
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Invitation revoked
        default:
          $ref: '#/components/responses/CompetitionError'
  /competition-invitations/inspect:
    post:
      operationId: inspectCompetitionInvitation
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/Token'
      responses:
        '200':
          description: Limited preview for an invitation holder; does not join or reveal members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        default:
          $ref: '#/components/responses/CompetitionError'
  /competition-invitations/join:
    post:
      operationId: joinCompetitionInvitation
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/Token'
      responses:
        '200':
          $ref: '#/components/responses/Competition'
        default:
          $ref: '#/components/responses/CompetitionError'
  /auth/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Current account, available sign-in methods, and a session-bound CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
  /auth/magic-links:
    post:
      operationId: requestMagicLink
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '202':
          description: Request accepted without disclosing delivery or account existence
        '400':
          $ref: '#/components/responses/AuthError'
        '503':
          $ref: '#/components/responses/AuthError'
        '403':
          description: Invalid CSRF token
  /auth/magic-links/inspect:
    post:
      operationId: inspectMagicLink
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/Token'
      responses:
        '200':
          description: Confirmation details; inspecting does not consume the token
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [email, purpose]
                properties:
                  email:
                    type: string
                    format: email
                  purpose:
                    type: string
                    enum: [sign-in, link]
        '400':
          $ref: '#/components/responses/AuthError'
        '403':
          description: Invalid CSRF token
  /auth/magic-links/confirm:
    post:
      operationId: confirmMagicLink
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/Token'
      responses:
        '200':
          description: Signed-in account; the session ID and CSRF token rotate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/AuthError'
        '409':
          $ref: '#/components/responses/AuthError'
        '403':
          description: Invalid CSRF token
  /auth/google:
    post:
      operationId: startGoogle
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [link]
              properties:
                link:
                  type: boolean
      responses:
        '200':
          description: Session-bound Google sign-in or explicit account-linking intent
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl:
                    type: string
                    enum: [/oauth2/authorization/google]
        '401':
          $ref: '#/components/responses/AuthError'
        '409':
          $ref: '#/components/responses/AuthError'
        '503':
          $ref: '#/components/responses/AuthError'
        '403':
          description: Invalid CSRF token
  /auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session invalidated
        '403':
          description: Invalid CSRF token
  /me:
    get:
      operationId: getProfile
      responses:
        '200':
          description: Current user's private account profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Not signed in
    put:
      operationId: updateProfile
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '200':
          description: Updated display name; roles and identity ownership are not editable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/AuthError'
        '401':
          description: Not signed in
        '403':
          description: Invalid CSRF token
  /status:
    get:
      operationId: getStatus
      summary: Check whether the API can reach PostgreSQL
      responses:
        '200':
          description: The API and database are available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
        '503':
          description: The API cannot reach the database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
components:
  parameters:
    CompetitionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
        maximum: 1000
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
  requestBodies:
    Token:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [token]
            properties:
              token:
                type: string
                pattern: '^[A-Za-z0-9_-]{43}$'
  responses:
    Competition:
      description: Competition metadata and viewer's role, never member activity or private authentication data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Competition'
    CompetitionError:
      description: Request rejected; private and draft competitions appear not found to outsiders
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
    AuthError:
      description: Authentication request rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
  schemas:
    MenuInput:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
    DirectoryInput:
      type: object
      additionalProperties: false
      required: [name, address, description, latitude, longitude, menuItems]
      properties:
        venueId: { type: string, format: uuid, nullable: true }
        baseRevision: { type: string, format: uuid, nullable: true }
        name: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 2000 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        menuItems:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MenuInput'
    DirectoryPhoto:
      type: object
      required: [id, menuItemId]
      properties:
        id: { type: string, format: uuid }
        menuItemId: { type: string, format: uuid, nullable: true }
    Venue:
      type: object
      required:
        [
          id,
          revision,
          name,
          address,
          description,
          latitude,
          longitude,
          menuItems,
          photos,
        ]
      properties:
        id: { type: string, format: uuid }
        revision: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        description: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        menuItems:
          type: array
          items:
            type: object
            required: [id, name, description]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              description: { type: string }
        photos:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryPhoto'
    VenuePage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
        hasMore: { type: boolean }
    Contribution:
      type: object
      required: [id, status, reviewReason, own, venue]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, PENDING, APPROVED, REJECTED] }
        reviewReason: { type: string }
        own: { type: boolean }
        venue:
          $ref: '#/components/schemas/Venue'
    ContributionPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Contribution'
        hasMore: { type: boolean }
    CompetitionSettings:
      type: object
      additionalProperties: false
      required:
        [name, rules, visibility, timeZone, startsAt, endsAt, allowSharedMeals]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        rules:
          type: string
          maxLength: 5000
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
        timeZone:
          type: string
          maxLength: 80
          description: IANA time-zone ID; numeric UTC offsets alone are not accepted
        startsAt:
          type: string
          format: date-time
          description: ISO 8601 instant, at most millisecond precision; future for creation or settings edits
        endsAt:
          type: string
          format: date-time
          description: ISO 8601 instant after the start, at most millisecond precision
        allowSharedMeals:
          type: boolean
    Competition:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          rules,
          visibility,
          timeZone,
          startsAt,
          endsAt,
          allowSharedMeals,
          submissionClosesAt,
          published,
          version,
          phase,
          viewerRole,
          memberCount,
        ]
      properties:
        name:
          $ref: '#/components/schemas/CompetitionSettings/properties/name'
        rules:
          $ref: '#/components/schemas/CompetitionSettings/properties/rules'
        visibility:
          $ref: '#/components/schemas/CompetitionSettings/properties/visibility'
        timeZone:
          $ref: '#/components/schemas/CompetitionSettings/properties/timeZone'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        allowSharedMeals:
          type: boolean
        id:
          type: string
          format: uuid
        submissionClosesAt:
          type: string
          format: date-time
        published:
          type: boolean
        version:
          type: integer
          format: int64
        phase:
          type: string
          enum: [DRAFT, SCHEDULED, ACTIVE, GRACE, CLOSED]
        viewerRole:
          type: string
          enum: [NONE, MEMBER, ORGANIZER]
        memberCount:
          type: integer
    CompetitionMember:
      type: object
      required: [id, displayName, role, status]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
          enum: [MEMBER, ORGANIZER]
        status:
          type: string
          enum: [ACTIVE, EXCLUDED]
    CompetitionInvitation:
      type: object
      required: [id, createdAt, expiresAt, revokedAt, active]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
    InvitationPreview:
      type: object
      required:
        [
          competitionId,
          name,
          rules,
          timeZone,
          startsAt,
          endsAt,
          allowSharedMeals,
          expiresAt,
        ]
      properties:
        competitionId:
          type: string
          format: uuid
        name:
          type: string
        rules:
          type: string
        timeZone:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        allowSharedMeals:
          type: boolean
        expiresAt:
          type: string
          format: date-time
    AuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Profile:
      type: object
      additionalProperties: false
      required: [id, displayName, siteOwner, providers]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        siteOwner:
          type: boolean
        providers:
          type: array
          items:
            type: string
            enum: [google, email]
    SessionInfo:
      type: object
      additionalProperties: false
      required: [user, csrfToken, csrfHeader, emailEnabled, googleEnabled]
      properties:
        user:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Profile'
        csrfToken:
          type: string
        csrfHeader:
          type: string
        emailEnabled:
          type: boolean
        googleEnabled:
          type: boolean
    ServiceStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
